<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIS Case Management Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Mobile adjustment for calendar */
        .fc .fc-toolbar { flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
        .fc .fc-toolbar-title { font-size: 1.25rem !important; }
        .fc-event { cursor: pointer; border: none !important; border-radius: 4px !important; padding: 2px 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-bold"><i class="fas fa-chart-line mr-2"></i> MIS Dashboard</div>
        <div class="text-sm">Local Storage Active <i class="fas fa-check-circle text-green-400 ml-1"></i></div>
    </nav>

    <div class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-folder-plus text-blue-600 mr-2"></i>New Case</h2>
                <form id="caseForm" class="flex flex-col gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Case Name</label>
                        <input type="text" id="caseName" required class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Shared By (Team Member)</label>
                        <input type="text" id="sharedBy" required class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="flex gap-3">
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Date Shared</label>
                            <input type="date" id="dateShared" required class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Classification</label>
                            <select id="caseType" class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                                <option>Material Event</option>
                                <option>Surveillance</option>
                                <option>Initial</option>
                                <option>Reclassification</option>
                                <option>Revalidation</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded transition">Save Case</button>
                </form>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-tasks text-green-600 mr-2"></i>Log Activity / To-Do</h2>
                <form id="todoForm" class="flex flex-col gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Activity / Task</label>
                        <input type="text" id="todoDesc" required placeholder="What did you do or plan to do?" class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div class="flex gap-3">
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Status</label>
                            <select id="todoStatus" class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
                                <option value="Done">Done (Logged)</option>
                                <option value="Todo">To-Do (Planned)</option>
                            </select>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Activity Date</label>
                            <input type="date" id="todoDate" required class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Set Deadline (Optional)</label>
                        <input type="date" id="todoDeadline" class="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <button type="submit" class="mt-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded transition">Add to Log</button>
                </form>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-file-excel text-red-600 mr-2"></i>Load Portfolio Deadlines</h2>
                <p class="text-xs text-slate-500 mb-3">Upload your <span class="font-bold">IMP PORTFOLIO.xlsx - Sheet1.csv</span> to populate external deadlines (Committee Review, PR, etc.).</p>
                <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
            </div>

        </div>

        <div class="w-full lg:w-2/3 flex flex-col gap-6">
            
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex-1">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-calendar-alt text-purple-600 mr-2"></i>Master Schedule</h2>
                <div id="calendar" class="h-[600px] w-full"></div>
                
                <div class="flex flex-wrap gap-4 mt-4 text-xs font-semibold text-slate-600">
                    <div class="flex items-center"><span class="w-3 h-3 rounded bg-blue-500 mr-1"></span> New Case</div>
                    <div class="flex items-center"><span class="w-3 h-3 rounded bg-green-500 mr-1"></span> Logged Activity</div>
                    <div class="flex items-center"><span class="w-3 h-3 rounded bg-amber-500 mr-1"></span> To-Do</div>
                    <div class="flex items-center"><span class="w-3 h-3 rounded bg-red-500 mr-1"></span> CSV Deadlines</div>
                </div>
            </div>

        </div>
    </div>

    <div id="caseModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">Case Details</h2>
                <button onclick="closeModal()" class="text-slate-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-5" id="modalContent">
                </div>
        </div>
    </div>

    <script>
        // --- Data Persistence Setup (LocalStorage) ---
        let appData = JSON.parse(localStorage.getItem('mis_data')) || {
            cases: [],
            todos: [],
            csvDeadlines: []
        };

        function saveData() {
            localStorage.setItem('mis_data', JSON.stringify(appData));
            if (calendarInstance) calendarInstance.refetchEvents();
        }

        // --- Utility to Generate Unique IDs ---
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- Calendar Initialization ---
        let calendarInstance;
        document.addEventListener('DOMContentLoaded', () => {
            const calendarEl = document.getElementById('calendar');
            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: window.innerWidth < 768 ? 'listWeek' : 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,listWeek'
                },
                events: fetchEventsForCalendar,
                eventClick: handleEventClick
            });
            calendarInstance.render();
        });

        // --- Format Events for FullCalendar ---
        function fetchEventsForCalendar(fetchInfo, successCallback, failureCallback) {
            let events = [];

            // 1. Map Cases
            appData.cases.forEach(c => {
                events.push({
                    id: c.id,
                    title: `Case: ${c.name} (${c.type})`,
                    start: c.dateShared,
                    color: '#3b82f6', // Blue
                    extendedProps: { type: 'case', data: c }
                });
            });

            // 2. Map ToDos / Activities
            appData.todos.forEach(t => {
                events.push({
                    id: t.id,
                    title: `${t.status === 'Done' ? '✅' : '⏳'} ${t.desc}`,
                    start: t.date,
                    color: t.status === 'Done' ? '#10b981' : '#f59e0b', // Green for done, Amber for todo
                    extendedProps: { type: 'todo', data: t }
                });
                // If Todo has a specific deadline, map it too
                if (t.deadline) {
                    events.push({
                        id: t.id + '_dl',
                        title: `🚨 Due: ${t.desc}`,
                        start: t.deadline,
                        color: '#ef4444', 
                        extendedProps: { type: 'todo', data: t }
                    });
                }
            });

            // 3. Map CSV Deadlines
            appData.csvDeadlines.forEach((csvItem, index) => {
                // Tracking the 3 critical deadlines specified
                if(csvItem['Deadline']) {
                    events.push({ id: `csv_${index}_1`, title: `📝 Notes Due: ${csvItem['Name']}`, start: csvItem['Deadline'], color: '#ef4444', allDay: true });
                }
                if(csvItem['Next PR']) {
                    events.push({ id: `csv_${index}_2`, title: `📢 PR Due: ${csvItem['Name']}`, start: csvItem['Next PR'], color: '#9333ea', allDay: true });
                }
                if(csvItem['Info request Date']) {
                    events.push({ id: `csv_${index}_3`, title: `✉️ Rating Ltr Due: ${csvItem['Name']}`, start: csvItem['Info request Date'], color: '#ec4899', allDay: true });
                }
            });

            successCallback(events);
        }

        // --- Form Handlers ---
        
        // 1. Add Case
        document.getElementById('caseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newCase = {
                id: generateId(),
                name: document.getElementById('caseName').value,
                sharedBy: document.getElementById('sharedBy').value,
                dateShared: document.getElementById('dateShared').value,
                type: document.getElementById('caseType').value,
                checklists: {
                    week1: { done: false, reminder: '', due: '' },
                    week2: { done: false, reminder: '', due: '' },
                    week3: { done: false, reminder: '', due: '' },
                    week4: { done: false, reminder: '', due: '' }
                }
            };
            appData.cases.push(newCase);
            saveData();
            e.target.reset();
            alert('Case added successfully!');
        });

        // 2. Add ToDo/Activity
        document.getElementById('todoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newTodo = {
                id: generateId(),
                desc: document.getElementById('todoDesc').value,
                status: document.getElementById('todoStatus').value,
                date: document.getElementById('todoDate').value,
                deadline: document.getElementById('todoDeadline').value
            };
            appData.todos.push(newTodo);
            saveData();
            e.target.reset();
        });

        // 3. Parse CSV Deadlines
        document.getElementById('csvFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    appData.csvDeadlines = results.data;
                    saveData();
                    alert(`Successfully imported ${results.data.length} portfolio records! Deadlines have been added to your calendar.`);
                }
            });
        });

        // --- Event Click & Modal Handlers (Weekly Checklists) ---
        
        function handleEventClick(info) {
            const props = info.event.extendedProps;
            if (props.type === 'case') {
                openCaseModal(props.data);
            } else if (props.type === 'todo') {
                alert(`Activity/Todo: ${props.data.desc}\nStatus: ${props.data.status}\nDate: ${props.data.date}`);
            }
        }

        function openCaseModal(caseData) {
            document.getElementById('modalTitle').innerText = `${caseData.name} (${caseData.type})`;
            
            let html = `
                <div class="mb-6 grid grid-cols-2 gap-4 text-sm">
                    <div><span class="font-bold text-slate-500">Shared By:</span> ${caseData.sharedBy}</div>
                    <div><span class="font-bold text-slate-500">Date Shared:</span> ${caseData.dateShared}</div>
                </div>
                <h3 class="font-bold text-lg mb-3"><i class="fas fa-list-check text-blue-600 mr-2"></i>Weekly Checklist Tracking</h3>
                <div class="flex flex-col gap-4">
            `;

            // Render Checklist for 4 weeks
            for (let i = 1; i <= 4; i++) {
                let week = caseData.checklists[`week${i}`];
                html += `
                    <div class="border p-4 rounded-lg bg-slate-50 flex flex-col md:flex-row items-center gap-4 shadow-sm">
                        <div class="flex-1 flex items-center gap-3">
                            <input type="checkbox" id="chk_${caseData.id}_${i}" ${week.done ? 'checked' : ''} 
                                onchange="updateChecklist('${caseData.id}', 'week${i}', 'done', this.checked)"
                                class="w-5 h-5 text-blue-600 rounded cursor-pointer">
                            <label for="chk_${caseData.id}_${i}" class="font-bold text-slate-700">Week ${i} Verification</label>
                        </div>
                        <div class="flex-1 flex gap-2 w-full">
                            <div class="w-1/2">
                                <label class="text-[10px] uppercase font-bold text-slate-500">Reminder Date</label>
                                <input type="date" value="${week.reminder}" 
                                    onchange="updateChecklist('${caseData.id}', 'week${i}', 'reminder', this.value)"
                                    class="w-full text-sm p-1 border rounded">
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] uppercase font-bold text-slate-500">Due Date</label>
                                <input type="date" value="${week.due}" 
                                    onchange="updateChecklist('${caseData.id}', 'week${i}', 'due', this.value)"
                                    class="w-full text-sm p-1 border rounded font-semibold text-red-600">
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `
                </div>
                <div class="mt-6 flex justify-end">
                    <button onclick="closeModal()" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700 transition">Close</button>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('caseModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('caseModal').classList.add('hidden');
        }

        // Globally exposed function to handle inline updates from modal
        window.updateChecklist = function(caseId, weekId, field, value) {
            const caseIndex = appData.cases.findIndex(c => c.id === caseId);
            if (caseIndex > -1) {
                appData.cases[caseIndex].checklists[weekId][field] = value;
                saveData(); // saves to localstorage immediately
            }
        };

    </script>
</body>
</html>
